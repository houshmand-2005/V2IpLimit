name: Build and Upload V2IpLimit

on:
  push:
    paths:
      - "v2iplimit.py"
      - "requirements.txt"
      - "build_requirements.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build-linux-debian12:
    name: Build Linux (Debian 12, Python 3.13) - ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container:
      image: python:3.13-bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64

    steps:
      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            build-essential patchelf
          rm -rf /var/lib/apt/lists/*

      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Install Python deps
        run: |
          python -m pip install -U pip wheel
          pip install -r requirements.txt
          pip install -r build_requirements.txt

      - name: Build Executable with Nuitka
        run: |
          python -m nuitka \
            --standalone --onefile --follow-imports \
            --include-plugin-directory=utils \
            --include-package=websockets,logging \
            --python-flag="-OO" \
            --output-dir=build \
            v2iplimit.py

      - name: Show required GLIBC (debug)
        run: |
          apt-get update && apt-get install -y --no-install-recommends binutils && rm -rf /var/lib/apt/lists/*
          strings -a build/**/*.bin | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -n 30 || true

      - name: Upload Artifacts (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: linux_${{ matrix.arch }}_debian12
          path: build/**/*.bin

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -r build_requirements.txt

      - name: Build Executable with Nuitka
        run: |
          python -m nuitka --standalone --onefile --follow-imports --include-plugin-directory=utils --include-package=websockets,logging --python-flag="-OO" --output-dir=build v2iplimit.py

      - name: Upload Artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: windows_${{ runner.arch }}_build
          path: build/**/*.exe
